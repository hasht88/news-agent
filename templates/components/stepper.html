{# 
  Reusable 5-Stage Stepper Component
  Usage: {% with current_step=1 %} {% include "components/stepper.html" %} {% endwith %}
  Expected current_step: 1 (Crawl), 2 (Curate), 3 (Create), 4 (Illustrate), 5 (Publish)
#}
{% set active_step = current_step if current_step is defined else 1 %}

<div id="pipelineStepperCard" class="w-full bg-white rounded-xl border border-stone-200/90 shadow-[0_1px_3px_rgba(0,0,0,0.02)] px-4 py-3.5 sm:px-6 sm:py-4 mb-6 transition-all">
  <!-- Stepper Top Bar Track & Nodes -->
  <div class="relative w-full">
    <!-- Progress Line Track Container (Strictly bounded between Node 1 center at 10% and Node 5 center at 90%) -->
    <div class="absolute top-4 sm:top-4.5 left-[10%] right-[10%] h-[2px] -translate-y-1/2 z-0 pointer-events-none">
      <!-- Background Track -->
      <div class="w-full h-full bg-stone-200"></div>
      <!-- Dynamic Active Progress Bar Fill -->
      <div id="stepperProgressLine" class="progress-bar-fill absolute top-0 left-0 h-full bg-stone-900 transition-all duration-300" style="width: {{ ((active_step - 1) / 4) * 100 }}%;"></div>
    </div>

    <!-- Stepper Nodes Grid (5 Steps) -->
    <div class="relative z-10 grid grid-cols-5 gap-1 sm:gap-2">

      <!-- STEP 1: CRAWL -->
      <button type="button" onclick="handleStepperNavigation(1)" class="group flex flex-col items-center focus:outline-none cursor-pointer" id="stepper-node-1" title="Stage 1: Crawl Source Scraper">
        <div id="stepper-circle-1" class="step-transition w-8 h-8 sm:w-9 sm:h-9 rounded-full flex items-center justify-center font-mono font-medium text-xs sm:text-sm border {% if active_step > 1 %}bg-stone-900 border-stone-900 text-white{% elif active_step == 1 %}bg-stone-900 border-stone-900 text-white ring-4 ring-stone-100{% else %}bg-white border-stone-300 text-stone-500 group-hover:border-stone-400{% endif %}">
          {% if active_step > 1 %}
            <svg class="w-3.5 h-3.5 text-white" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
            </svg>
          {% else %}
            <span>1</span>
          {% endif %}
        </div>
        <div class="mt-2 flex flex-col items-center">
          <span id="stepper-title-1" class="text-[11px] sm:text-xs font-semibold {% if active_step >= 1 %}text-stone-900{% else %}text-stone-400{% endif %} tracking-tight transition-colors">Crawl</span>
          <span class="text-[10px] text-stone-400 hidden md:inline font-normal">Source Scraper</span>
        </div>
      </button>

      <!-- STEP 2: CURATE -->
      <button type="button" onclick="handleStepperNavigation(2)" class="group flex flex-col items-center focus:outline-none cursor-pointer" id="stepper-node-2" title="Stage 2: Curate Filter & Validate">
        <div id="stepper-circle-2" class="step-transition w-8 h-8 sm:w-9 sm:h-9 rounded-full flex items-center justify-center font-mono font-medium text-xs sm:text-sm border {% if active_step > 2 %}bg-stone-900 border-stone-900 text-white{% elif active_step == 2 %}bg-stone-900 border-stone-900 text-white ring-4 ring-stone-100{% else %}bg-white border-stone-300 text-stone-500 group-hover:border-stone-400{% endif %}">
          {% if active_step > 2 %}
            <svg class="w-3.5 h-3.5 text-white" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
            </svg>
          {% else %}
            <span>2</span>
          {% endif %}
        </div>
        <div class="mt-2 flex flex-col items-center">
          <span id="stepper-title-2" class="text-[11px] sm:text-xs font-semibold {% if active_step == 2 %}text-stone-900 font-bold{% elif active_step > 2 %}text-stone-800{% else %}text-stone-400{% endif %} tracking-tight transition-colors">Curate</span>
          <span class="text-[10px] text-stone-400 hidden md:inline font-normal">Filter & Select</span>
        </div>
      </button>

      <!-- STEP 3: CREATE -->
      <button type="button" onclick="handleStepperNavigation(3)" class="group flex flex-col items-center focus:outline-none cursor-pointer" id="stepper-node-3" title="Stage 3: Create Draft & Headline">
        <div id="stepper-circle-3" class="step-transition w-8 h-8 sm:w-9 sm:h-9 rounded-full flex items-center justify-center font-mono font-medium text-xs sm:text-sm border {% if active_step > 3 %}bg-stone-900 border-stone-900 text-white{% elif active_step == 3 %}bg-stone-900 border-stone-900 text-white ring-4 ring-stone-100{% else %}bg-white border-stone-300 text-stone-500 group-hover:border-stone-400{% endif %}">
          {% if active_step > 3 %}
            <svg class="w-3.5 h-3.5 text-white" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
            </svg>
          {% else %}
            <span>3</span>
          {% endif %}
        </div>
        <div class="mt-2 flex flex-col items-center">
          <span id="stepper-title-3" class="text-[11px] sm:text-xs font-semibold {% if active_step == 3 %}text-stone-900 font-bold{% elif active_step > 3 %}text-stone-800{% else %}text-stone-400{% endif %} tracking-tight transition-colors">Create</span>
          <span class="text-[10px] text-stone-400 hidden md:inline font-normal">Draft Story</span>
        </div>
      </button>

      <!-- STEP 4: ILLUSTRATE -->
      <button type="button" onclick="handleStepperNavigation(4)" class="group flex flex-col items-center focus:outline-none cursor-pointer" id="stepper-node-4" title="Stage 4: Illustrate Media Generation">
        <div id="stepper-circle-4" class="step-transition w-8 h-8 sm:w-9 sm:h-9 rounded-full flex items-center justify-center font-mono font-medium text-xs sm:text-sm border {% if active_step > 4 %}bg-stone-900 border-stone-900 text-white{% elif active_step == 4 %}bg-stone-900 border-stone-900 text-white ring-4 ring-stone-100{% else %}bg-white border-stone-300 text-stone-500 group-hover:border-stone-400{% endif %}">
          {% if active_step > 4 %}
            <svg class="w-3.5 h-3.5 text-white" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
            </svg>
          {% else %}
            <span>4</span>
          {% endif %}
        </div>
        <div class="mt-2 flex flex-col items-center">
          <span id="stepper-title-4" class="text-[11px] sm:text-xs font-semibold {% if active_step == 4 %}text-stone-900 font-bold{% elif active_step > 4 %}text-stone-800{% else %}text-stone-400{% endif %} tracking-tight transition-colors">Illustrate</span>
          <span class="text-[10px] text-stone-400 hidden md:inline font-normal">Media Generation</span>
        </div>
      </button>

      <!-- STEP 5: PUBLISH -->
      <button type="button" onclick="handleStepperNavigation(5)" class="group flex flex-col items-center focus:outline-none cursor-pointer" id="stepper-node-5" title="Stage 5: Publish Distribution">
        <div id="stepper-circle-5" class="step-transition w-8 h-8 sm:w-9 sm:h-9 rounded-full flex items-center justify-center font-mono font-medium text-xs sm:text-sm border {% if active_step == 5 %}bg-stone-900 border-stone-900 text-white ring-4 ring-stone-100{% else %}bg-white border-stone-300 text-stone-500 group-hover:border-stone-400{% endif %}">
          <span>5</span>
        </div>
        <div class="mt-2 flex flex-col items-center">
          <span id="stepper-title-5" class="text-[11px] sm:text-xs font-semibold {% if active_step == 5 %}text-stone-900 font-bold{% else %}text-stone-400{% endif %} tracking-tight transition-colors">Publish</span>
          <span class="text-[10px] text-stone-400 hidden md:inline font-normal">Distribution</span>
        </div>
      </button>

    </div>
  </div>
</div>

<style>
  .step-transition {
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .progress-bar-fill {
    transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }
</style>

<script>
  // Stepper state & navigation module
  let currentPipelineStep = {{ active_step }};
  const totalPipelineSteps = 5;

  const pipelineStepsConfig = [
    {
      number: 1,
      title: "Crawl",
      subtitle: "Source Scraper",
      iconSvg: `<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 12h20M4.93 4.93l14.14 14.14M4.93 19.07L19.07 4.93"/></svg>`,
      desc: "Gather raw news feeds, RSS dispatches, and press announcements."
    },
    {
      number: 2,
      title: "Curate",
      subtitle: "Filter & Validate",
      iconSvg: `<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>`,
      desc: "Filter for relevance, factual consistency, credibility, and category tags."
    },
    {
      number: 3,
      title: "Create",
      subtitle: "Draft & Headline",
      iconSvg: `<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19 7-7 3 3-7 7-3-3z"/><path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="m2 2 7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>`,
      desc: "Synthesize facts, craft concise summaries, and compose punchy headlines."
    },
    {
      number: 4,
      title: "Illustrate",
      subtitle: "Media Generation",
      iconSvg: `<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>`,
      desc: "Generate editorial header graphics, charts, and media assets."
    },
    {
      number: 5,
      title: "Publish",
      subtitle: "Distribution",
      iconSvg: `<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>`,
      desc: "Final approval gate and automated dispatch across web, newsletter, and social feeds."
    }
  ];

  function updateStepperVisuals(step) {
    currentPipelineStep = step;
    const progressPercentage = ((step - 1) / (totalPipelineSteps - 1)) * 100;
    const progressLine = document.getElementById('stepperProgressLine');
    if (progressLine) progressLine.style.width = `${progressPercentage}%`;

    for (let i = 1; i <= totalPipelineSteps; i++) {
      const circle = document.getElementById(`stepper-circle-${i}`);
      const title = document.getElementById(`stepper-title-${i}`);
      if (!circle || !title) continue;

      if (i < step) {
        circle.className = "step-transition w-8 h-8 sm:w-9 sm:h-9 rounded-full flex items-center justify-center font-mono font-medium text-xs sm:text-sm border bg-stone-900 border-stone-900 text-white shadow-2xs";
        circle.innerHTML = `<svg class="w-3.5 h-3.5 text-white" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" /></svg>`;
        title.className = "text-[11px] sm:text-xs font-semibold text-stone-800 tracking-tight transition-colors";
      } else if (i === step) {
        circle.className = "step-transition w-8 h-8 sm:w-9 sm:h-9 rounded-full flex items-center justify-center font-mono font-medium text-xs sm:text-sm border bg-stone-900 border-stone-900 text-white ring-4 ring-stone-100";
        circle.innerHTML = `<span>${i}</span>`;
        title.className = "text-[11px] sm:text-xs font-bold text-stone-900 tracking-tight transition-colors";
      } else {
        circle.className = "step-transition w-8 h-8 sm:w-9 sm:h-9 rounded-full flex items-center justify-center font-mono font-medium text-xs sm:text-sm border bg-white border-stone-300 text-stone-400 group-hover:border-stone-400";
        circle.innerHTML = `<span>${i}</span>`;
        title.className = "text-[11px] sm:text-xs font-semibold text-stone-400 tracking-tight transition-colors";
      }
    }

    const cfg = pipelineStepsConfig[step - 1];
    const counterLabel = document.getElementById('stepperCounterLabel');
    if (counterLabel) counterLabel.innerText = `STEP ${cfg.number} OF 5`;

    const statusText = document.getElementById('stepperStatusText');
    if (statusText) statusText.innerText = step === 5 ? 'Final Stage' : 'In Progress';

    const descEl = document.getElementById('stepperDescription');
    if (descEl) descEl.innerText = cfg.desc;

    const iconContainer = document.getElementById('stepperIconContainer');
    if (iconContainer) iconContainer.innerHTML = cfg.iconSvg;

    const prevBtn = document.getElementById('stepperPrevBtn');
    if (prevBtn) {
      if (step === 1) {
        prevBtn.disabled = true;
        prevBtn.className = "px-4 py-2.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-400 cursor-not-allowed transition-all flex items-center gap-1.5";
      } else {
        prevBtn.disabled = false;
        prevBtn.className = "px-4 py-2.5 rounded-xl border border-slate-200 hover:border-slate-300 text-xs font-bold text-slate-700 hover:bg-slate-50 active:scale-95 transition-all flex items-center gap-1.5 cursor-pointer";
      }
    }

    const nextBtnText = document.getElementById('stepperNextBtnText');
    if (nextBtnText) {
      nextBtnText.innerText = step === 5 ? "Finish Pipeline" : "Continue";
    }
  }

  function handleStepperNavigation(targetStep) {
    if (targetStep === 1) {
      if (window.location.pathname !== "/") {
        window.location.href = "/";
      } else {
        updateStepperVisuals(1);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    } else if (targetStep === 2) {
      if (window.location.pathname !== "/") {
        window.location.href = "/";
      } else {
        updateStepperVisuals(2);
        if (typeof toggleMainFilter === 'function' && !isMainFilterActive) {
          toggleMainFilter();
        }
      }
    } else if (targetStep === 3) {
      if (window.location.pathname !== "/story") {
        window.location.href = "/story";
      } else {
        updateStepperVisuals(3);
        if (typeof switchStoryTab === 'function') {
          switchStoryTab('editor');
        }
      }
    } else if (targetStep === 4) {
      if (window.location.pathname !== "/story") {
        window.location.href = "/story";
      } else {
        updateStepperVisuals(4);
        const mediaSection = document.getElementById("modularBlocksSection");
        if (mediaSection) {
          mediaSection.scrollIntoView({ behavior: 'smooth' });
        }
      }
    } else if (targetStep === 5) {
      if (window.location.pathname !== "/story") {
        window.location.href = "/story";
      } else {
        updateStepperVisuals(5);
        if (typeof switchStoryTab === 'function') {
          switchStoryTab('preview');
        }
      }
    }
  }

  function stepperGoPrevious() {
    if (currentPipelineStep === 1) return;
    handleStepperNavigation(currentPipelineStep - 1);
  }

  function stepperGoContinue() {
    if (currentPipelineStep === 1) {
      handleStepperNavigation(2);
    } else if (currentPipelineStep === 2) {
      if (typeof processSelectedNews === 'function') {
        const checked = document.querySelectorAll(".news-checkbox:checked");
        if (checked.length > 0) {
          processSelectedNews();
        } else {
          window.location.href = "/story";
        }
      } else {
        window.location.href = "/story";
      }
    } else if (currentPipelineStep === 3) {
      handleStepperNavigation(4);
    } else if (currentPipelineStep === 4) {
      handleStepperNavigation(5);
    } else if (currentPipelineStep === 5) {
      window.location.href = "/";
    }
  }
</script>
