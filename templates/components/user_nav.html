{# User Navigation Profile & Sign Out dropdown / buttons #}
<div class="flex items-center gap-1.5 pl-2 border-l border-stone-200/90 ml-1">
  {% if user %}
    <div class="relative group">
      <button 
        type="button" 
        class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium text-stone-700 hover:text-stone-900 hover:bg-stone-100 border border-transparent hover:border-stone-200 transition"
        title="{{ user.email }}"
      >
        <span class="w-5 h-5 rounded-full bg-stone-900 text-white flex items-center justify-center text-[10px] font-bold">
          {{ (user.full_name or user.email)[:1].upper() }}
        </span>
        <span class="hidden md:inline-block max-w-[120px] truncate">{{ user.full_name or user.email }}</span>
        {% if user.is_admin %}
          <span class="hidden sm:inline-block text-[9px] font-mono px-1 py-0.5 rounded bg-stone-100 text-stone-600 border border-stone-200">Admin</span>
        {% endif %}
      </button>

      <!-- Dropdown menu on hover/focus -->
      <div class="absolute right-0 top-full pt-1 hidden group-hover:block group-focus-within:block z-50">
        <div class="w-48 bg-white rounded-lg shadow-lg border border-stone-200 py-1.5 text-xs text-stone-700">
          <div class="px-3 py-1.5 border-b border-stone-100 font-mono text-[11px] text-stone-500 truncate">
            {{ user.email }}
          </div>
          <form action="/logout" method="POST" class="m-0">
            <button 
              type="submit" 
              class="w-full text-left px-3 py-2 text-red-600 hover:bg-red-50 flex items-center gap-2 transition"
            >
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
              </svg>
              <span>Sign out</span>
            </button>
          </form>
        </div>
      </div>
    </div>
  {% else %}
    <a 
      href="/login" 
      class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-semibold bg-stone-900 text-white shadow-2xs hover:bg-stone-800 transition"
    >
      Sign in
    </a>
  {% endif %}
</div>
